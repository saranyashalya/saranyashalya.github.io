        highlights:
          - "**SCL — System Comprehension Lab:** Contributed to the RAG data preprocessing pipeline using AWS Step Functions and Lambda; built Python packages for downloading and processing files from internal docstores."
          - "Built knowledge bases and Agents on **AWS Bedrock** for RAG applications, and used **Bedrock Data Automation** for multimodal preprocessing."
          - "Currently using **AWS Bedrock AgentCore Runtime** to automate deployment of Strands Agents, with observability for token usage and traceability."
