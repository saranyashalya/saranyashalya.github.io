          - "Used statistical models to compare pre- and post-upgrade test runs (EMCA traces) and built **regression models** to predict baseband scheduler metrics, fine-tuned for higher accuracy."
          - "Developed a **Cell and Site Categorizer** based on traffic volume, user experience, and cell load metrics using Random Forest and XGBoost."

