          - "Driving **Agentic RAG evaluation** with RAGAS on benchmark and live data."
          - "Building Agentic AI solutions with the **Claude Code Harness** and AgentCore Harness — producing reusable agentic packages (subagents, skills, MCPs, hooks)."

