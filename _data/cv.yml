        summary: >
          Lead GenAI / RAG / Agentic AI initiatives across enterprise programs.
        highlights:
          - "Designed and built end-to-end RAG solutions using **Knowledge Fabric** architecture — integrating knowledge graphs, vector search, entity resolution, and AI agents for accurate enterprise retrieval."
          - "Built data preprocessing pipelines for multimodal data processing using **AWS Step Functions** and **AWS Lambda**."
          - "Hands-on experience with **AWS Bedrock** for creating knowledge bases and deploying AI agents for enterprise-grade RAG applications."
          - "Working on **AWS Bedrock AgentCore** capabilities for deploying and managing AI agents with observability, token usage tracking, runtime monitoring, and traceability."
          - "Improved RAG performance and accuracy by developing **graph-based retrieval** and optimization solutions."
          - "Performed **Agentic RAG evaluation** using benchmark datasets and live production data with RAGAS metrics. Deep knowledge on LLM-as-a-judge evaluation strategies."
          - "Building Agentic AI solutions using **Claude Code, Kiro, and AgentCore** agents as harnesses — creating reusable AI components (sub-agents, skills, MCPs, hooks) for scalable agent development."
          - "Developed Python automation packages for generating **vector embeddings** from multiple document sources using open-source (Hugging Face GTE, BGE) and proprietary embedding models."
          - "Designed **Apache Airflow** workflows to orchestrate large-scale data preprocessing, embedding generation, and ingestion pipelines."
          - "Worked with vector databases (**FAISS, ChromaDB, OpenSearch**) for efficient storage, indexing, and semantic retrieval."

